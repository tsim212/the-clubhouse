<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commissioner · The Clubhouse</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><meta name="robots" content="noindex"></head>
<body><div class="shell" id="a"></div><script>
const a=document.getElementById('a'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const head=`<header class="brand"><div class="club-mark">TC</div><div><p>COMMISSIONER</p><h1>Clubhouse Admin</h1></div></header>`;
async function load(){const r=await fetch('/api/admin/teams',{cache:'no-store'});if(r.status===401)return login();const d=await r.json();
 a.innerHTML=head+`<p class="muted">Reset a PIN and that team's manager will be asked to create a new one next time they open the app. Anyone already signed in on that team gets signed out.</p>
 <div class="card"><table><tr><th>TEAM</th><th>PIN</th><th></th></tr>${d.teams.map(t=>`<tr><td><strong>${esc(t.name)}</strong><br><small>${esc(t.manager)}${t.claimedAt?' · set '+new Date(t.claimedAt).toLocaleString():''}</small></td><td>${t.claimed?'<span class="pill">SET</span>':'<span class="pill watch">OPEN</span>'}</td><td>${t.claimed?`<button class="btn small red" data-id="${t.id}" data-n="${esc(t.name)}">Reset</button>`:''}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Recent activity</h3>${d.log.map(l=>`<div><small>${new Date(l.t).toLocaleString()}</small> — team ${esc((d.teams.find(t=>t.id===l.team)||{}).name||l.team)} ${esc(l.event)}</div>`).join('')||'<small>None yet</small>'}</div>
 <p><small>Storage: ${d.storage} · ESPN cookie: ${d.espnCookie?'set':'not set (league is public)'}</small></p><button class="ghost" id="lo">Log out</button> <p><a href="/">← Back to app</a></p>`;
 a.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Reset the PIN for '+b.dataset.n+'?'))return;await fetch('/api/admin/reset-pin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({team:b.dataset.id})});load()});
 document.getElementById('lo').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});login()}}
function login(){a.innerHTML=head+`<div class="card"><h3>Commissioner login</h3><input class="txt" type="password" id="pw" placeholder="Admin password" autocomplete="current-password"><div style="height:10px"></div><button class="btn" id="go">Sign in</button><p class="err" id="e"></p></div>`;
 const go=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok)load();else e.textContent=(await r.json()).error};
 document.getElementById('go').onclick=go;pw.onkeydown=k=>k.key==='Enter'&&go()}
load();
</script></body></html>
